<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Confirmation of attendance</title>
    <link rel="stylesheet" href="css/print.css">
    <script src="js/langue.js" defer></script>
    <script src="js/certificat.js" defer></script>
  </head>
  <body class="is-grille" data-doc="certificat" data-page="print" data-i18n-title="certTitle">
    <button type="button" class="grille" id="grille" aria-pressed="true">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path d="M1 4h14M1 8h14M1 12h14"></path>
      </svg>
      <span data-i18n="grid">Grid</span>
    </button>

    <form class="json-drop" id="json-form" action="#" method="get">
      <label class="json-drop__zone" id="json-drop-zone" for="json-file">
        <span id="json-drop-text" data-i18n="dropJson">Drop a JSON file here, or click to choose one.</span>
        <input id="json-file" name="json" type="file" accept="application/json,.json" required>
      </label>
    </form>

    <main id="certificats"></main>

    <template id="modele-certificat">
      <article lang="en">
        <header>
          <ul class="logos" role="list">
            <li>
              <img class="logo-etat" src="medias/logo_republique-francaise.svg" width="85" height="77" alt="French Republic">
            </li>
            <li>
              <img class="logo-lycee" src="medias/logo_breq.svg" height="40" alt="">
            </li>
            <li>
              <img class="logo-ue" src="medias/logo_ue.svg" width="810" height="540" alt="European Union">
            </li>
            <li>
              <img class="logo-erasmus" src="medias/logo_erasmus.svg" width="124" height="29" alt="Erasmus+">
            </li>
          </ul>
          <p class="lieu-date"><time class="date-jour"></time><span class="ville-date"></span></p>
          <h2>Confirmation of attendance</h2>
        </header>

        <section class="corps" aria-label="Confirmation of attendance">
          <p class="intro">We hereby confirm that</p>
          <p class="nom"><span class="prenom"></span> <span class="patronyme"></span></p>
          <p class="affiliation"><span class="role-prefix"></span> <span class="etablissement-envoi"></span><span class="pays-en"></span></p>
          <p class="participation">has participated in the Erasmus+ BIP workshop</p>
          <p class="bip"></p>
          <p class="lieu-accueil"><span class="lieu-avant">at </span><span class="etablissement"></span><span class="lieu-apres"></span></p>
          <p class="periode"><span class="periode-avant">from </span><time class="date-debut"></time><span class="periode-entre"> to </span><time class="date-fin"></time></p>
          <p class="ects"><span class="ects-avant">The number of credits awarded is </span><strong class="ects-valeur">3 ECTS</strong><span class="ects-entre"> and the course has been </span><strong class="acheve">successfully completed</strong></p>
          <p class="virtuelle"><span class="virtuelle-avant">The virtual component took place on </span><time class="date-virtuelle"></time></p>
        </section>

        <footer>
          <p class="cachet">stamp and signature</p>
          <p class="signataire"></p>
          <p class="codes"><span class="code-erasmus-ligne"><span class="code-label">Erasmus code </span><span class="code-erasmus"></span></span><br><span class="oid-ligne"><span class="oid-label">OID </span><span class="oid"></span></span></p>
        </footer>
      </article>
    </template>
  </body>
</html>
